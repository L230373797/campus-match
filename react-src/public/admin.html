<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>校园匹配运营后台</title>
    <meta name="robots" content="noindex,nofollow" />
    <style>
      :root {
        color-scheme: light;
        --ink: #101827;
        --muted: #64748b;
        --line: rgba(148, 163, 184, .36);
        --glass: rgba(255, 255, 255, .74);
        --blue: #087fff;
        --red: #ff3b30;
        --green: #16a34a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 20% 10%, rgba(8, 127, 255, .25), transparent 32rem),
          radial-gradient(circle at 78% 16%, rgba(255, 45, 85, .20), transparent 30rem),
          linear-gradient(135deg, #eef7ff 0%, #f9fbff 48%, #fff4f7 100%);
      }

      a {
        color: var(--blue);
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      .shell {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 28px 0 56px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 28px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .mark {
        width: 52px;
        height: 52px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        background: rgba(255, 255, 255, .76);
        border: 1px solid rgba(255, 255, 255, .82);
        box-shadow: 0 18px 42px rgba(15, 23, 42, .10);
        font-weight: 900;
        color: var(--blue);
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(24px, 4vw, 40px);
        letter-spacing: 0;
      }

      .subtitle {
        margin-top: 4px;
        color: var(--muted);
        font-weight: 650;
      }

      .glass {
        background: var(--glass);
        border: 1px solid rgba(255, 255, 255, .82);
        border-radius: 24px;
        box-shadow: 0 24px 64px rgba(15, 23, 42, .12), inset 0 1px rgba(255, 255, 255, .75);
        backdrop-filter: blur(22px) saturate(1.35);
        -webkit-backdrop-filter: blur(22px) saturate(1.35);
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 16px 18px;
        margin-bottom: 18px;
      }

      .tabs {
        display: flex;
        gap: 10px;
        padding: 8px;
        margin-bottom: 18px;
      }

      .tab {
        flex: 1;
        min-height: 42px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        font-weight: 900;
        cursor: pointer;
      }

      .tab.active {
        color: var(--ink);
        background: rgba(255, 255, 255, .72);
        box-shadow: 0 12px 24px rgba(15, 23, 42, .08);
      }

      .stats {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .overview-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 14px;
      }

      .metric-card {
        padding: 18px;
        min-height: 132px;
        display: grid;
        align-content: space-between;
      }

      .metric-card span {
        color: var(--muted);
        font-size: 13px;
        font-weight: 850;
      }

      .metric-card strong {
        margin-top: 10px;
        color: var(--ink);
        font-size: clamp(28px, 5vw, 42px);
        line-height: 1;
        font-weight: 950;
        font-variant-numeric: tabular-nums;
      }

      .metric-card p {
        margin-top: 10px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
        font-weight: 750;
      }

      .overview-panels {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 14px;
      }

      .overview-panel {
        padding: 18px;
      }

      .overview-panel h2 {
        margin-bottom: 12px;
        font-size: 18px;
      }

      .activity-list {
        display: grid;
        gap: 10px;
      }

      .activity-item {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        padding: 12px;
        border-radius: 16px;
        background: rgba(255, 255, 255, .56);
      }

      .activity-item strong {
        display: block;
        color: var(--ink);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .activity-item p {
        margin-top: 4px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .activity-time {
        color: var(--muted);
        font-size: 12px;
        font-weight: 850;
        white-space: nowrap;
      }

      .user-tools {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 190px;
        gap: 12px;
        padding: 14px;
        margin-bottom: 14px;
      }

      .user-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .user-card {
        padding: 16px;
        display: grid;
        gap: 14px;
      }

      .user-head {
        display: grid;
        grid-template-columns: 56px minmax(0, 1fr);
        gap: 12px;
        align-items: center;
      }

      .user-avatar {
        width: 56px;
        height: 56px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: var(--blue);
        background: rgba(255, 255, 255, .74);
        border: 1px solid rgba(148, 163, 184, .28);
        font-weight: 950;
      }

      .user-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .user-name {
        min-width: 0;
      }

      .user-name h2 {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 19px;
      }

      .user-badges,
      .user-metrics {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .user-badge {
        min-height: 28px;
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 0 10px;
        color: var(--muted);
        background: rgba(255, 255, 255, .62);
        border: 1px solid rgba(148, 163, 184, .22);
        font-size: 12px;
        font-weight: 900;
      }

      .user-badge.good {
        color: #047857;
        background: rgba(16, 185, 129, .14);
      }

      .user-badge.warn {
        color: #b45309;
        background: rgba(245, 158, 11, .16);
      }

      .user-badge.danger {
        color: #b91c1c;
        background: rgba(239, 68, 68, .14);
      }

      .user-card .meta {
        word-break: break-word;
      }

      .readiness {
        display: grid;
        gap: 8px;
      }

      .readiness-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--muted);
        font-size: 13px;
        font-weight: 850;
      }

      .readiness-bar {
        height: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(148, 163, 184, .20);
      }

      .readiness-bar span {
        display: block;
        height: 100%;
        width: var(--score, 0%);
        border-radius: inherit;
        background: linear-gradient(90deg, #52b6ff, #087fff, #ffb8cf);
      }

      select {
        min-height: 48px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: rgba(255, 255, 255, .76);
        color: var(--ink);
        outline: none;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 34px;
        padding: 0 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, .68);
        border: 1px solid rgba(255, 255, 255, .78);
        color: var(--muted);
        font-size: 13px;
        font-weight: 800;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .button {
        min-height: 42px;
        border: 0;
        border-radius: 999px;
        padding: 0 17px;
        color: #fff;
        background: linear-gradient(180deg, #1a8cff, #087fff);
        box-shadow: 0 14px 30px rgba(8, 127, 255, .24);
        font-weight: 850;
        cursor: pointer;
      }

      .button.secondary {
        color: var(--ink);
        background: rgba(255, 255, 255, .72);
        border: 1px solid rgba(148, 163, 184, .38);
        box-shadow: none;
      }

      .button.danger {
        background: linear-gradient(180deg, #ff6b61, var(--red));
        box-shadow: 0 14px 30px rgba(255, 59, 48, .20);
      }

      .button:disabled {
        opacity: .62;
        cursor: wait;
      }

      .login {
        width: min(460px, 100%);
        margin: 10vh auto 0;
        padding: 26px;
      }

      .form-grid {
        display: grid;
        gap: 14px;
        margin-top: 22px;
      }

      label {
        display: grid;
        gap: 8px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 800;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: rgba(255, 255, 255, .76);
        color: var(--ink);
        outline: none;
      }

      input {
        min-height: 48px;
        padding: 0 14px;
      }

      textarea {
        min-height: 90px;
        padding: 13px 14px;
        resize: vertical;
      }

      .message {
        margin-top: 14px;
        color: var(--red);
        font-size: 14px;
        font-weight: 750;
      }

      .queue {
        display: grid;
        gap: 14px;
      }

      .empty,
      .loading {
        padding: 44px 22px;
        text-align: center;
        color: var(--muted);
        font-weight: 750;
      }

      .review-card {
        padding: 18px;
      }

      .review-head {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 16px;
        align-items: start;
        margin-bottom: 14px;
      }

      .name {
        font-size: 20px;
        font-weight: 900;
      }

      .meta {
        margin-top: 6px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }

      .badge {
        border-radius: 999px;
        padding: 7px 11px;
        background: rgba(245, 158, 11, .14);
        color: #b45309;
        font-size: 12px;
        font-weight: 900;
      }

      .details {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin: 14px 0;
      }

      .detail {
        padding: 12px;
        border-radius: 16px;
        background: rgba(255, 255, 255, .56);
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .detail strong {
        display: block;
        margin-bottom: 4px;
        color: var(--ink);
      }

      .privacy-reason {
        margin: 12px 0;
        padding: 13px 14px;
        border-radius: 16px;
        background: rgba(255, 255, 255, .56);
        color: var(--muted);
        line-height: 1.65;
      }

      .campus-card {
        display: grid;
        gap: 10px;
        margin: 12px 0 14px;
      }

      .campus-card img {
        width: 100%;
        max-height: 280px;
        object-fit: contain;
        border-radius: 18px;
        background: rgba(15, 23, 42, .06);
        border: 1px solid rgba(148, 163, 184, .30);
      }

      .review-actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 12px;
      }

      .hidden {
        display: none !important;
      }

      :root {
        color-scheme: dark;
        --ink: #f7fbff;
        --muted: rgba(225, 235, 248, .72);
        --line: rgba(154, 205, 255, .22);
        --glass: rgba(8, 17, 30, .68);
        --blue: #67c8ff;
        --red: #ff6677;
        --green: #54e0a8;
        --panel: rgba(255, 255, 255, .075);
        --panel-strong: rgba(255, 255, 255, .12);
        --shadow: rgba(0, 0, 0, .34);
      }

      body {
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 6%, rgba(103, 200, 255, .28), transparent 28rem),
          radial-gradient(circle at 86% 2%, rgba(255, 102, 119, .18), transparent 26rem),
          radial-gradient(circle at 62% 98%, rgba(117, 95, 255, .18), transparent 34rem),
          linear-gradient(155deg, #07101c 0%, #0b1423 48%, #101321 100%);
        overflow-x: hidden;
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: -1;
      }

      body::before {
        opacity: .26;
        background-image:
          linear-gradient(rgba(255, 255, 255, .055) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, .055) 1px, transparent 1px);
        background-size: 28px 28px;
        mask-image: linear-gradient(to bottom, rgba(0, 0, 0, .92), transparent 78%);
      }

      body::after {
        opacity: .76;
        background:
          conic-gradient(from 160deg at 72% 22%, transparent, rgba(118, 230, 255, .16), transparent 24%),
          conic-gradient(from 25deg at 16% 72%, transparent, rgba(255, 130, 190, .13), transparent 26%);
        filter: blur(18px);
        animation: admin-aurora 14s ease-in-out infinite alternate;
      }

      @keyframes admin-aurora {
        from {
          transform: translate3d(-1%, -1%, 0) scale(1);
        }
        to {
          transform: translate3d(1.5%, 1%, 0) scale(1.04);
        }
      }

      .shell {
        position: relative;
        padding-top: 32px;
      }

      .glass {
        background: linear-gradient(180deg, rgba(255, 255, 255, .11), rgba(255, 255, 255, .055));
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 24px 70px var(--shadow), inset 0 1px rgba(255, 255, 255, .13);
        backdrop-filter: blur(22px) saturate(1.25);
        -webkit-backdrop-filter: blur(22px) saturate(1.25);
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        padding: 12px 0 14px;
        background: linear-gradient(180deg, rgba(7, 16, 28, .96), rgba(7, 16, 28, .66), transparent);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }

      .brand {
        min-width: 0;
      }

      .mark {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        color: var(--ink);
        background:
          linear-gradient(160deg, rgba(255, 255, 255, .18), rgba(255, 255, 255, .05)),
          radial-gradient(circle at 30% 20%, rgba(103, 200, 255, .72), transparent 56%);
        border: 1px solid rgba(255, 255, 255, .18);
        box-shadow: 0 18px 48px rgba(103, 200, 255, .18);
      }

      h1 {
        font-size: clamp(25px, 4vw, 42px);
        line-height: 1.05;
      }

      .subtitle {
        color: var(--muted);
      }

      .tabs {
        gap: 8px;
        padding: 7px;
      }

      .tab {
        color: rgba(225, 235, 248, .66);
        transition: color .2s ease, background .2s ease, transform .2s ease;
      }

      .tab:hover {
        color: var(--ink);
        transform: translateY(-1px);
      }

      .tab.active {
        color: #04111f;
        background: linear-gradient(180deg, #f8fbff, #d9e8ff 62%, #f7d9e4);
        box-shadow: 0 16px 36px rgba(103, 200, 255, .18);
      }

      .toolbar {
        padding: 14px;
      }

      .metric-card,
      .overview-panel,
      .user-card,
      .review-card {
        position: relative;
        overflow: hidden;
      }

      .metric-card::before,
      .overview-panel::before,
      .user-card::before,
      .review-card::before,
      .login::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(135deg, rgba(255, 255, 255, .14), transparent 42%);
        opacity: .6;
      }

      .metric-card > *,
      .overview-panel > *,
      .user-card > *,
      .review-card > *,
      .login > * {
        position: relative;
      }

      .activity-item,
      .detail,
      .privacy-reason,
      .user-badge,
      .pill {
        color: var(--muted);
        background: var(--panel);
        border: 1px solid rgba(255, 255, 255, .10);
        border-radius: 8px;
      }

      .activity-item strong,
      .detail strong,
      .user-name h2,
      .name,
      .metric-card strong,
      .overview-panel h2 {
        color: var(--ink);
      }

      .badge,
      .user-badge.good {
        color: #022014;
        background: linear-gradient(180deg, #a5ffd6, #54e0a8);
      }

      .user-badge.warn {
        color: #2b1700;
        background: linear-gradient(180deg, #ffe7a8, #ffc35b);
      }

      .user-badge.danger {
        color: #2c0509;
        background: linear-gradient(180deg, #ffc0c8, #ff6677);
      }

      .readiness-bar {
        background: rgba(255, 255, 255, .12);
      }

      .readiness-bar span {
        background: linear-gradient(90deg, #67c8ff, #8b7cff, #ff9dc1);
        box-shadow: 0 0 18px rgba(103, 200, 255, .32);
      }

      input,
      textarea,
      select {
        color: var(--ink);
        background: rgba(255, 255, 255, .08);
        border-color: rgba(255, 255, 255, .15);
        transition: border-color .2s ease, background .2s ease, box-shadow .2s ease;
      }

      input:focus,
      textarea:focus,
      select:focus {
        border-color: rgba(103, 200, 255, .72);
        background: rgba(255, 255, 255, .12);
        box-shadow: 0 0 0 4px rgba(103, 200, 255, .14);
      }

      input::placeholder,
      textarea::placeholder {
        color: rgba(225, 235, 248, .45);
      }

      .button {
        color: #04111f;
        background: linear-gradient(180deg, #f8fbff, #d9e8ff 62%, #f7d9e4);
        box-shadow: 0 16px 34px rgba(103, 200, 255, .22);
        transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease;
      }

      .button:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 20px 42px rgba(103, 200, 255, .28);
      }

      .button.secondary {
        color: var(--ink);
        background: rgba(255, 255, 255, .08);
        border: 1px solid rgba(255, 255, 255, .14);
      }

      .button.danger {
        color: #fff;
        background: linear-gradient(180deg, #ff8190, #ff445c);
        box-shadow: 0 16px 34px rgba(255, 68, 92, .22);
      }

      .login {
        position: relative;
        margin-top: max(8vh, 42px);
        padding: 28px;
      }

      .user-avatar {
        color: #04111f;
        background: linear-gradient(180deg, #f8fbff, #d9e8ff);
        border-color: rgba(255, 255, 255, .18);
      }

      .campus-card img {
        border-radius: 8px;
        background: rgba(255, 255, 255, .06);
        border-color: rgba(255, 255, 255, .12);
      }

      .empty,
      .loading,
      .message {
        color: var(--muted);
      }

      @media (max-width: 720px) {
        .shell {
          width: min(100% - 24px, 1120px);
          padding-top: 18px;
        }

        .topbar,
        .toolbar,
        .review-head,
        .review-actions {
          align-items: stretch;
          flex-direction: column;
        }

        .topbar,
        .toolbar {
          display: grid;
        }

        .tabs {
          display: grid;
          grid-template-columns: 1fr;
        }

        .details {
          grid-template-columns: 1fr;
        }

        .overview-grid,
        .overview-panels,
        .user-tools,
        .user-grid {
          grid-template-columns: 1fr;
        }

        .actions,
        .review-actions {
          display: grid;
          grid-template-columns: 1fr 1fr;
        }

        .review-actions {
          justify-content: stretch;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section id="login-view" class="login glass">
        <div class="brand">
          <div class="mark">管</div>
          <div>
            <h1>运营后台</h1>
            <p class="subtitle">登录后处理认证队列和账号资料请求。</p>
          </div>
        </div>
        <form id="login-form" class="form-grid">
          <label>
            运营账号邮箱
            <input id="email" type="email" autocomplete="email" required placeholder="admin@qq.com" />
          </label>
          <label>
            密码
            <input id="password" type="password" autocomplete="current-password" required placeholder="请输入密码" />
          </label>
          <button class="button" type="submit">进入运营后台</button>
          <p id="login-message" class="message" role="status"></p>
        </form>
      </section>

      <section id="admin-view" class="hidden">
        <header class="topbar">
          <div class="brand">
            <div class="mark">管</div>
            <div>
              <h1>认证队列</h1>
              <p class="subtitle" id="admin-subtitle">运营后台</p>
            </div>
          </div>
          <div class="actions">
            <a class="button secondary" href="/">回到用户端</a>
            <button id="logout" class="button secondary" type="button">退出后台</button>
          </div>
        </header>

        <div class="tabs glass">
          <button id="tab-overview" class="tab active" type="button">数据看板</button>
          <button id="tab-users" class="tab" type="button">用户管理</button>
          <button id="tab-verification" class="tab" type="button">认证队列</button>
          <button id="tab-privacy" class="tab" type="button">账号资料请求</button>
        </div>

        <div class="toolbar glass">
          <div class="stats">
            <span class="pill" id="pending-count">待处理 0</span>
